name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm install
      - name: Emit package lock for repository pinning
        run: |
          echo 'PACKAGE_LOCK_BASE64_BEGIN'
          base64 -w0 package-lock.json
          echo
          echo 'PACKAGE_LOCK_BASE64_END'
      - run: npm run security:audit
      - run: npm run db:generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - run: npm run typecheck
      - run: npm test
      - name: Install XSD validator
        run: python -m pip install --disable-pip-version-check -r requirements-fiscal.txt
      - name: Validate CFDI 4.0 + Carta Porte 3.1 against SAT XSD
        run: python scripts/validate_sat_xsd.py
      - run: npm run build
